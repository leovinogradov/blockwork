<!doctype html>
<meta charset="utf-8">
<title>Measurement depth checks</title>
<style>body{font:16px system-ui;background:#101923;color:#ddd;padding:24px}canvas{width:400px;height:400px}</style>
<h1>Measurement depth checks</h1>
<p id="result">Running GPU checks…</p>
<pre id="failures"></pre>
<div id="viewport" style="width:400px;height:400px;position:relative"></div>
<script type="module">
// Run npm run dev and open /tests/measurement-annotation.html for real GPU checks.
import * as THREE from 'three';
import { createMeasurementAnnotation } from '/src/measurement-annotation.ts';
import { createViewport } from '/src/viewport.ts';
import { formatInches } from '/src/model.ts';

const renderer = new THREE.WebGLRenderer();
renderer.setSize(400, 400);
document.body.append(renderer.domElement);
const target = new THREE.WebGLRenderTarget(400, 400);
const pixels = new Uint8Array(400 * 400 * 4);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#101923');
const box = new THREE.Mesh(new THREE.BoxGeometry(16, 16, 2), new THREE.MeshBasicMaterial({ color: '#244eaa' }));
box.position.z = -1;
scene.add(box);
const overlay = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
overlay.setAttribute('width', '400'); overlay.setAttribute('height', '400');
document.body.append(overlay);
const occlusionRay = new THREE.Raycaster();
function makeAnnotation(preview = false) {
  const annotation = createMeasurementAnnotation(overlay, preview);
  const update = annotation.update;
  return { ...annotation, update(...args) {
    const camera = args[7];
    update(...args, [400, 400], (point) => {
      if (!box.visible) return false;
      box.updateMatrixWorld();
      const position = new THREE.Vector3(...point), projected = position.clone().project(camera);
      occlusionRay.setFromCamera(new THREE.Vector2(projected.x, projected.y), camera);
      const hit = occlusionRay.intersectObject(box, false)[0];
      const distance = position.sub(occlusionRay.ray.origin).dot(occlusionRay.ray.direction);
      return !!hit && hit.distance < distance - .001;
    });
  } };
}
const annotation = makeAnnotation();
scene.add(annotation.group);
const measurement = { id: 'width', axis: 'z', offset: 2, lineHeight: 1 };
let checks = 0;
const errors = [];
let previewCamera;
function check(condition, message) { checks++; if (!condition) errors.push(message); }
function render(camera) {
  renderer.setRenderTarget(target);
  renderer.render(scene, camera);
  renderer.readRenderTargetPixels(target, 0, 0, 400, 400, pixels);
  return pixels.slice();
}
function differences(a, b) { let count = 0; for (let i = 0; i < a.length; i += 4) if (a[i] !== b[i] || a[i + 1] !== b[i + 1] || a[i + 2] !== b[i + 2]) count++; return count; }
for (const projection of ['perspective', 'orthographic']) {
  const camera = projection === 'perspective'
    ? new THREE.PerspectiveCamera(28, 1, .1, 100)
    : new THREE.OrthographicCamera(-8, 8, 8, -8, .1, 100);
  camera.position.set(0, 0, 40); camera.lookAt(0, 0, 0); camera.updateMatrixWorld();
  previewCamera = camera;
  annotation.group.visible = false; box.scale.x = 1;
  const base = render(camera);
  for (const through of [true, false]) for (const z of [-2, -1 / 64, 0, 1 / 64]) {
    annotation.update([-4, -2, z], [4, -2, z], 8, measurement, false, false, through, camera);
    const count = differences(base, render(camera));
    check((count > 0) === (through || z >= 0), `${projection}: through=${through}, z=${z}, changed pixels=${count}`);
    check((annotation.label.getAttribute('display') !== 'none') === (through || z >= 0), `${projection}: SVG label center visibility through=${through}, z=${z}`);
  }
  // An occluding box hides the label and the middle of the dimension, while
  // exposed portions remain visible instead of hiding the entire annotation.
  box.scale.x = .375; annotation.group.visible = false;
  const partialBase = render(camera);
  annotation.update([-4, -2, -1], [4, -2, -1], 8, measurement, false, false, true, camera);
  const throughCount = differences(partialBase, render(camera));
  annotation.update([-4, -2, -1], [4, -2, -1], 8, measurement, false, false, false, camera);
  const partialCount = differences(partialBase, render(camera));
  check(partialCount > 0 && partialCount < throughCount, `${projection}: partial occlusion ${partialCount}/${throughCount}`);
  check(annotation.label.getAttribute('display') === 'none', `${projection}: covered label center hides entire SVG label`);
  annotation.update([-4, -2, 0], [4, -2, 0], 8, measurement, false, true, false, camera);
  render(camera);
  let amberPixels = 0;
  for (let i = 0; i < pixels.length; i += 4) if (pixels[i] > 150 && pixels[i + 1] > 90 && pixels[i + 2] < 130) amberPixels++;
  check(amberPixels > 0, `${projection}: selected annotation is highlighted`);
}
renderer.setRenderTarget(null);
renderer.render(scene, previewCamera);

// Live values update SVG text synchronously, with no font texture to resize.
box.visible = false; annotation.group.visible = false;
const preview = makeAnnotation(true);
scene.add(preview.group);
box.visible = true; box.scale.x = 1;
preview.update([-4, -2, -2], [4, -2, -2], 8, measurement, false, false, false, previewCamera);
check(preview.label.getAttribute('display') !== 'none' && !preview.group.children[0].material.depthTest, 'preview: labels and lines always show through objects');
box.visible = false;
for (const distance of [8, 12, 3, 3.125, 0, 120, 8]) {
  const start = [-distance / 2, -2, 0], end = [distance / 2, -2, 0];
  preview.update(start, end, distance, measurement, false, false, true, previewCamera);
  const reused = render(previewCamera);
  preview.group.visible = false;
  const fresh = makeAnnotation(true);
  scene.add(fresh.group);
  fresh.update(start, end, distance, measurement, false, false, true, previewCamera);
  const expected = render(previewCamera);
  check(differences(reused, expected) === 0, `preview: updated ${distance} in label matches a fresh label`);
  check(preview.label.textContent === fresh.label.textContent && preview.label.getAttribute('transform') === fresh.label.getAttribute('transform'), `preview: updated ${distance} in SVG text and projection match a fresh label`);
  fresh.dispose();
}
preview.dispose();
// Camera motion only changes projection; text remains readable from either side.
for (const axis of ['x', 'y', 'z']) for (const side of [1, -1]) {
  previewCamera.position.set(20 * side, -25 * side, 30 * side); previewCamera.lookAt(0, 0, 0); previewCamera.updateMatrixWorld();
  annotation.update([-4, -2, 0], [4, 2, 3], 9, { ...measurement, axis }, false, false, true, previewCamera);
  const matrix = annotation.label.getAttribute('transform').slice(7, -1).split(' ').map(Number);
  check(matrix.every(Number.isFinite) && matrix[0] * matrix[3] - matrix[1] * matrix[2] > 0, `${axis}/${side}: readable finite SVG projection`);
  check(annotation.containsPoint(matrix[4], matrix[5]), `${axis}/${side}: transformed label center remains selectable`);
}
annotation.hide(); check(annotation.label.getAttribute('display') === 'none' && !annotation.containsPoint(200, 200), 'hidden annotations remove SVG visibility and picking');

// Projected dimensions separate the solid axis line from dashed anchor connectors.
previewCamera.position.set(0, 0, 40); previewCamera.lookAt(0, 0, 0); previewCamera.updateMatrixWorld();
for (const offset of [0, 3, -2]) {
  annotation.update([0, 1, 0], [2, 0, 0], 2, { ...measurement, distanceAxis: 'x', offset }, false, true, false, previewCamera);
  const [solid, dashed] = annotation.group.children;
  const line = solid.geometry.getAttribute('position'), connectors = dashed.geometry.getAttribute('position');
  check(solid.material instanceof THREE.LineBasicMaterial && dashed.material instanceof THREE.LineDashedMaterial, `axis/offset=${offset}: solid dimension and dashed connectors use distinct materials`);
  check(line.getX(0) === 0 && line.getY(0) === 1 + offset && line.getX(1) === 2 && line.getY(1) === 1 + offset, `axis/offset=${offset}: solid line follows offset X projection`);
  check(connectors.getX(0) === 0 && connectors.getY(0) === 1 && connectors.getY(1) === 1 + offset && connectors.getX(2) === 2 && connectors.getY(2) === 0 && connectors.getY(3) === 1 + offset, `axis/offset=${offset}: dashed connectors reach both actual picked points`);
  check(annotation.label.textContent === '2 in' && dashed.material.depthTest && dashed.material.color.getHex() === solid.material.color.getHex(), `axis/offset=${offset}: axis label, selection color and depth testing are preserved`);
  annotation.update([0, 1, 0], [2, 0, 0], 2, { ...measurement, distanceAxis: 'x', offset }, false, false, true, previewCamera);
  check(!dashed.material.depthTest, `axis/offset=${offset}: through mode applies to dashed connectors`);
}
annotation.update([0, 1, 0], [2, 0, 0], Math.sqrt(5), measurement, false, false, true, previewCamera);
check(!annotation.group.children[1].visible, 'releasing axis mode removes dashed connectors from an existing annotation');
annotation.dispose(); target.dispose(); box.geometry.dispose(); box.material.dispose(); renderer.dispose();
check(overlay.children.length === 0, 'disposing annotations removes SVG labels');

// Exercise real viewport selection and OrbitControls together. Only native
// pointer capture is stubbed because synthetic test pointers are not hardware.
const host = document.querySelector('#viewport');
let selected = null;
let draftAxis = null, createdAxis = null;
let createdMeasurement = null;
let axisModeStatus = false, modeChanges = 0;
const viewport = createViewport(host, (id) => { selected = id; }, undefined, undefined, undefined, undefined,
  (start, end, offset, axis, distanceAxis) => { createdAxis = axis; createdMeasurement = { start, end, offset, axis, distanceAxis }; },
  (stage, axis) => { if (stage === 'second') draftAxis = axis; },
  (axisMode) => { axisModeStatus = axisMode; modeChanges++; });
const testBox = { id: 'box', name: 'Box', size: [12, 8, 4], position: [0, 0, 0], color: '#86a9a3' };
const dimension = { id: 'measurement', start: { objectId: 'box', coordinates: [0, 0, 0] }, end: { objectId: 'box', coordinates: [1, 0, 0] }, axis: 'z', offset: 4, lineHeight: 1 };
viewport.setBoxes([testBox]); viewport.setMeasurements([dimension]); viewport.setView('top');
const canvas = host.querySelector('canvas');
canvas.setPointerCapture = () => {}; canvas.releasePointerCapture = () => {}; canvas.hasPointerCapture = () => false;
const gl = canvas.getContext('webgl2');
function framePixels() { return new Promise((resolve) => requestAnimationFrame(() => {
  const image = new Uint8Array(gl.drawingBufferWidth * gl.drawingBufferHeight * 4);
  gl.readPixels(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight, gl.RGBA, gl.UNSIGNED_BYTE, image);
  resolve(image);
})); }
function pointer(type, dx = 0, dy = 0, buttons = 0, shiftKey = false) {
  const bounds = canvas.getBoundingClientRect();
  canvas.dispatchEvent(new PointerEvent(type, { bubbles: true, pointerType: 'mouse', pointerId: 1, button: 0, buttons, shiftKey, clientX: bounds.left + bounds.width / 2 + dx, clientY: bounds.top + bounds.height / 2 + dy }));
}
function click() { pointer('pointerdown', 0, 0, 1); pointer('pointerup'); }
for (const projection of ['perspective', 'orthographic']) {
  viewport.setProjection(projection); viewport.setView('top'); viewport.setMeasurementsThroughObjects(true);
  await framePixels(); click();
  check(selected === 'measurement', `${projection}: label click selects measurement`);
  check(host.querySelector('.measurement-label:not(.preview) text')?.textContent === '12 in', `${projection}: viewport uses SVG label text`);
  const beforeMove = await framePixels();
  pointer('pointermove', 50, 30);
  const afterMove = await framePixels();
  check(differences(beforeMove, afterMove) === 0, `${projection}: released label click must not leave orbit active`);
  viewport.setMeasurementsThroughObjects(false); await framePixels(); click();
  check(selected === 'box', `${projection}: an occluded label cannot be selected`);
  check(host.querySelector('.measurement-label:not(.preview)')?.getAttribute('display') === 'none', `${projection}: viewport hides label behind box`);
}
viewport.setMode('sketch');
viewport.setRectangles([{ id: 'box', name: 'Rectangle', size: [12, 8], position: [0, 0], color: '#ffffff' }]);
viewport.setMeasurements([{ ...dimension, start: { objectId: 'box', coordinates: [0, 0] }, end: { objectId: 'box', coordinates: [1, 0] } }]);
await framePixels(); click();
check(selected === 'measurement', 'sketch: label click selects measurement');
const sketchBeforeMove = await framePixels(); pointer('pointermove', 50, 30);
check(differences(sketchBeforeMove, await framePixels()) === 0, 'sketch: released label click must not leave pan active');

// Real creation clicks select Auto from the first endpoint's view, then retain
// the concrete axis through the offset click even if the camera rotates.
viewport.setMode('model'); viewport.setBoxes([testBox]); viewport.setProjection('orthographic'); viewport.setMeasurementsThroughObjects(true);
for (const fixture of [
  { view: 'top', axis: 'z', start: [0, 0, 1], end: [1, 0, 1], length: 12 },
  { view: 'front', axis: 'y', start: [0, 0, 0], end: [1, 0, 0], length: 12 },
  { view: 'right', axis: 'x', start: [1, 0, 0], end: [1, 1, 0], length: 8 },
]) {
  viewport.setView(fixture.view);
  viewport.setMeasurements([{ ...dimension, axis: fixture.axis, offset: 0, start: { objectId: 'box', coordinates: fixture.start }, end: { objectId: 'box', coordinates: fixture.end } }]);
  viewport.setMeasurementAxis('auto'); viewport.setMeasurementTool(true);
  await framePixels();
  const matrix = host.querySelector('.measurement-label:not(.preview)').getAttribute('transform').slice(7, -1).split(' ').map(Number);
  function clickAlongLine(sign) {
    const dx = matrix[4] + sign * matrix[0] * fixture.length / 2 - 200;
    const dy = matrix[5] + sign * matrix[1] * fixture.length / 2 - 200;
    pointer('pointerdown', dx, dy, 1); pointer('pointerup', dx, dy);
  }
  draftAxis = createdAxis = null;
  clickAlongLine(-1); check(draftAxis === fixture.axis, `${fixture.view}: Auto selects ${fixture.axis} at first endpoint`);
  clickAlongLine(1); viewport.setView('iso'); await framePixels(); click();
  check(createdAxis === fixture.axis, `${fixture.view}: creation retains ${fixture.axis} after rotating the camera`);
  viewport.setMeasurementTool(false);
}

// Shift updates a stationary pointer while retaining the actual picked edge point.
for (const mode of ['model', 'sketch']) for (const projection of ['perspective', 'orthographic']) {
  viewport.setMode(mode);
  if (mode === 'model') viewport.setBoxes([testBox]);
  else viewport.setRectangles([{ id: 'box', name: 'Rectangle', size: [12, 8], position: [0, 0], color: '#ffffff' }]);
  viewport.setProjection(projection);
  for (const fixture of (mode === 'sketch' ? [
    { view: 'top', axis: 'z', start: [0, 0], end: [1, 0], length: 12, height: 8, expected: [8.25 / 12, 1], distanceAxis: 'x' },
  ] : [
    { view: 'top', axis: 'z', start: [0, 0, 1], end: [1, 0, 1], length: 12, height: 8, expected: [8.25 / 12, 1, 1], distanceAxis: 'x' },
    { view: 'front', axis: 'y', start: [0, 0, 0], end: [1, 0, 0], length: 12, height: 4, expected: [4.25 / 12, 0, 1], distanceAxis: 'x' },
    { view: 'front', axis: 'y', start: [0, 0, 0], end: [1, 0, 0], length: 12, height: 4, pickX: 2.25, distance: 4, expected: [2.25 / 12, 0, 1], distanceAxis: 'z' },
    { view: 'right', axis: 'x', start: [1, 0, 0], end: [1, 1, 0], length: 8, height: 4, expected: [1, 4.25 / 8, 1], distanceAxis: 'y' },
  ])) {
    viewport.setView(fixture.view);
    viewport.setMeasurements([{ ...dimension, axis: fixture.axis, offset: 0, start: { objectId: 'box', coordinates: fixture.start }, end: { objectId: 'box', coordinates: fixture.end } }]);
    viewport.setMeasurementAxis('auto'); viewport.setMeasurementTool(true);
    await framePixels();
    const matrix = host.querySelector('.measurement-label:not(.preview)').getAttribute('transform').slice(7, -1).split(' ').map(Number);
    const screen = (x, y) => [matrix[4] + (x - fixture.length / 2) * matrix[0] - y * matrix[2] - 200, matrix[5] + (x - fixture.length / 2) * matrix[1] - y * matrix[3] - 200];
    const first = screen(0, 0), second = screen(fixture.pickX ?? fixture.height + .25, fixture.height);
    pointer('pointerdown', ...first, 1); pointer('pointerup', ...first);
    pointer('pointermove', ...second); await framePixels();
    const label = host.querySelector('.measurement-label.preview text');
    const freeDistance = label.textContent;
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Shift', shiftKey: true, bubbles: true }));
    await framePixels();
    const expectedDistance = `${formatInches(fixture.distance ?? fixture.height + .25)} in`;
    check(label.textContent === expectedDistance && label.textContent !== freeDistance, `${mode}/${projection}/${fixture.view}: Shift updates the stationary preview to the largest axis distance`);
    const changesAfterPress = modeChanges;
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Shift', shiftKey: true, repeat: true, bubbles: true }));
    window.dispatchEvent(new KeyboardEvent('keyup', { key: 'Shift', shiftKey: false, bubbles: true }));
    await framePixels();
    check(label.textContent === expectedDistance && axisModeStatus && modeChanges === changesAfterPress, `${mode}/${projection}/${fixture.view}: key repeat and release leave axis mode on`);
    pointer('pointermove', ...second); await framePixels();
    check(label.textContent === expectedDistance, `${mode}/${projection}/${fixture.view}: pointer movement without holding Shift retains axis mode`);
    host.querySelector('input').dispatchEvent(new KeyboardEvent('keydown', { key: 'Shift', shiftKey: true, bubbles: true }));
    check(axisModeStatus && modeChanges === changesAfterPress, `${mode}/${projection}/${fixture.view}: typing Shift in a field does not toggle axis mode`);
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Shift', shiftKey: true, bubbles: true }));
    await framePixels();
    check(label.textContent === freeDistance && !axisModeStatus, `${mode}/${projection}/${fixture.view}: a second Shift press restores full distance`);
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Shift', shiftKey: true, bubbles: true }));
    createdMeasurement = null;
    pointer('pointerdown', ...second, 1); pointer('pointerup', ...second);
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Shift', shiftKey: true, bubbles: true }));
    await framePixels();
    check(label.textContent === freeDistance && !axisModeStatus, `${mode}/${projection}/${fixture.view}: toggling during label placement changes the pending dimension`);
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Shift', shiftKey: true, bubbles: true }));
    click();
    check(createdMeasurement?.distanceAxis === fixture.distanceAxis && createdMeasurement?.end.coordinates.every((n, i) => Math.abs(n - fixture.expected[i]) < 1e-3), `${mode}/${projection}/${fixture.view}: shifted click saves the chosen axis and the actual geometry edge anchor`);
    check(axisModeStatus, `${mode}/${projection}/${fixture.view}: creating a dimension retains the mode for the next measurement`);
    viewport.setMeasurementTool(false);
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Shift', shiftKey: true, bubbles: true }));
    viewport.setMeasurementTool(true);
    check(axisModeStatus, `${mode}/${projection}/${fixture.view}: leaving and re-entering Measure retains the selected mode`);
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Shift', shiftKey: true, bubbles: true }));
    check(!axisModeStatus, `${mode}/${projection}/${fixture.view}: Shift can toggle the mode before the first point`);
    viewport.setMeasurementTool(false);
  }
}
document.querySelector('#result').textContent = errors.length ? `${errors.length} failed / ${checks} checks` : `Passed ${checks} GPU and interaction checks`;
document.querySelector('#failures').textContent = errors.join('\n');
viewport.dispose();
</script>
