name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Follow the Pages build/deploy template: finish uploading before scheduling deployment.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      # Keep the build's name when only the failed deployment job is re-run.
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.17.0'
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build for the repository URL
        run: |
          pnpm build --base=/blockwork/
          test -s dist/index.html
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          # A full re-run uploads a new artifact without duplicating the previous name.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded artifact to be listed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        timeout-minutes: 3
        env:
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          retries: 3
          script: |
            const name = process.env.ARTIFACT_NAME;
            const id = Number(process.env.ARTIFACT_ID);
            if (!name || !Number.isSafeInteger(id) || id <= 0) {
              throw new Error('The build did not produce a valid Pages artifact.');
            }
            for (let attempt = 1; attempt <= 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id: context.runId,
                name,
                per_page: 100,
              });
              const artifacts = data.artifacts.filter(artifact => artifact.name === name);
              if (artifacts.length > 1) {
                throw new Error(`Multiple artifacts named ${name} were found.`);
              }
              if (artifacts.length === 1) {
                const artifact = artifacts[0];
                if (artifact.id !== id || artifact.expired) {
                  throw new Error(`Artifact ${name} does not match the build or has expired. Start a new workflow run.`);
                }
                core.info(`Pages artifact ${name} (${id}) is available.`);
                return;
              }
              if (attempt < 12) {
                core.info(`Pages artifact is not listed yet (attempt ${attempt}/12); retrying in 5 seconds.`);
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
            throw new Error(`Pages artifact ${name} (${id}) was not listed after 12 checks.`);
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
